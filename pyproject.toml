[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentevalops"
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
version = "1.0.0"
description = "AgentEvalOps — Continuous AI Agent Qualification Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
postgres = ["psycopg[binary]>=3.1", "alembic>=1.13"]

[project.scripts]
agentevalops-seed = "app.seed:main"
agentevalops-acceptance = "app.acceptance:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's documented Depends() default pattern. BLE001/S110: verifier/tool layers
# intentionally catch broad exceptions and convert them into scored failures/evidence.
ignore = ["B008", "BLE001", "S110", "PLW1510"]

[project.urls]
Homepage = "https://github.com/sanjaymouraly/agentevalops-platform"
Repository = "https://github.com/sanjaymouraly/agentevalops-platform"
Issues = "https://github.com/sanjaymouraly/agentevalops-platform/issues"

